# render.yaml - Render Blueprint Configuration
# Documentation: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: openwa-api
    env: docker
    dockerfilePath: ./Dockerfile
    region: oregon
    plan: starter
    numInstances: 1
    
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 2785
      - key: DATABASE_TYPE
        value: sqlite
      - key: STORAGE_TYPE
        value: local
      - key: REDIS_ENABLED
        value: false
      - key: QUEUE_ENABLED
        value: false
      - key: PUPPETEER_EXECUTABLE_PATH
        value: /usr/bin/chromium
      - key: PUPPETEER_SKIP_CHROMIUM_DOWNLOAD
        value: "true"
      - key: REDIRECT_TO_DASHBOARD
        value: "true"
    
    disks:
      - name: openwa-data
        mountPath: /app/data
        sizeGB: 2
    
    healthCheckPath: /api/health
    autoDeploy: true