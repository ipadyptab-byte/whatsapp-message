# Render Blueprint - Auto-deployments for OpenWA
# https://render.com/docs/blueprint-spec
services:
  # API Backend - Deploy this first
  - type: web
    name: whatsapp-message-api
    env: node
    region: oregon
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: node dist/main
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_TYPE
        value: sqlite
      - key: DATABASE_NAME
        value: /data/openwa.sqlite
      - key: SESSION_DATA_PATH
        value: /data/sessions
      - key: PUPPETEER_HEADLESS
        value: "true"
      - key: PUPPETEER_ARGS
        value: "--no-sandbox,--disable-setuid-sandbox,--disable-dev-shm-usage"
      - key: STORAGE_TYPE
        value: local
      - key: STORAGE_LOCAL_PATH
        value: /data/media
    disk:
      name: openwa-data
      mountPath: /data
      sizeGB: 1
  # Dashboard Frontend with API Proxy
  - type: web
    name: whatsapp-message-panel
    env: node
    region: oregon
    plan: starter
    buildCommand: npm install && npm run dashboard:build
    startCommand: node dashboard-server/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_URL
        fromService:
          name: whatsapp-message-api
          envVarKey: RENDER_EXTERNAL_URL
          type: web
      - key: DASHBOARD_PATH
        value: dashboard/dist
