# Render Blueprint - Auto-deployments for OpenWA
# https://render.com/docs/blueprint-spec
services:
  # API Backend + Dashboard (served together)
  - type: web
    name: whatsapp-message-wa
    env: node
    region: oregon
    plan: starter
    buildCommand: npm ci --include=dev && npm run build && npm run dashboard:build
    startCommand: node start-all.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_TYPE
        value: sqlite
      - key: DATABASE_NAME
        value: /data/openwa.sqlite
      - key: SESSION_DATA_PATH
        value: /data/sessions
      - key: PUPPETEER_HEADLESS
        value: "true"
      - key: PUPPETEER_ARGS
        value: "--no-sandbox,--disable-setuid-sandbox,--disable-dev-shm-usage"
      - key: STORAGE_TYPE
        value: local
      - key: STORAGE_LOCAL_PATH
        value: /data/media
      - key: DASHBOARD_PATH
        value: dashboard/dist
    disk:
      name: openwa-data
      mountPath: /data
      sizeGB: 1
